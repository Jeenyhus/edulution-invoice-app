services:
  - type: web
    name: edulution-invoice-backend
    env: node
    buildCommand: cd backend && npm install && mkdir -p data
    startCommand: cd backend && node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: static
    name: edulution-invoice-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDirectory: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://edulution-invoice-backend.onrender.com
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
