services:
  - type: web
    name: edulution-invoice-backend
    env: node
    buildCommand: cd backend && npm install && mkdir -p data
    startCommand: cd backend && node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: edulution-invoice-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: edulution-invoice-backend
          type: web
          property: url
